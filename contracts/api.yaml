openapi: 3.1.0
info:
  title: Call-to-Predict Phase 1 capture API
  version: 1.2.0
  summary: Gemini browser voice demo. Simulated data, capture only, zero execution.
  description: |
    Backend contract for Phase 1 of the browser voice assistant.

    Hard rules of this phase:

    - Nothing is ever sent to Gemini. No order is placed, routed or cancelled. The backend holds no
      Gemini credentials in this phase.
    - Every query (order status, market search, order book) is SIMULATED from the fixed catalog in
      `x-simulated-catalog`. Every tool response carries `simulated: true`.
    - The only writes are captured intents (contracts/intent.schema.json, `status: captured`) and the
      timestamped session transcript.
    - This document lists every endpoint. There are exactly nine operations: one signed-URL endpoint,
      GET and POST /intents, POST /transcripts, and five tool handlers
      (capture_order_intent, capture_cancel_intent, get_order_status, search_markets, get_orderbook).
    - A sixth agent tool, explore_demo_chart, runs entirely in the browser. It has no endpoint here,
      makes no request to this backend or to anyone else, and writes nothing. See `x-browser-tools`.
    - Reading simulated data and opening a buy or sell preview can never execute an order. Nothing
      in this system can. See `x-execution-boundary`, which also fixes where any future Gemini
      access must live: on the server, never in the browser and never in a tool the model calls.

    Cross-cutting behavior is specified in the `x-` sections at the end of this file:
    `x-session-lifecycle`, `x-confirmation-enforcement`, `x-idempotency`, `x-normalization`,
    `x-utterance-check`, `x-audit-records`, `x-query-matching`, `x-validation-order`,
    `x-error-codes`, `x-capture-status-queries`, `x-cancel-resolution`, `x-browser-tools`,
    `x-execution-boundary`, `x-simulated-catalog` and `x-revision`.
    Tool parameters and responses are also listed, per tool, in contracts/tools.json; the two files
    must agree and this file wins on HTTP details.

    Revision 1.1.0 clarified 1.0.0 without adding or removing an operation, a tool, a parameter or
    an intent field. Revision 1.2.0 documents the browser-only chart tool and the execution
    boundary; it changes no operation, no backend tool, no parameter and no intent field. Every
    change is listed in `x-revision`.
servers:
  - url: /api
    description: Same-origin application backend.
tags:
  - name: voice
  - name: intents
  - name: transcripts
  - name: tools

paths:
  /voice/signed-url:
    post:
      tags: [voice]
      operationId: createVoiceSession
      summary: Start a voice session and get a signed URL for the private ElevenLabs agent WebSocket.
      description: |
        Mints a new `session_id` and an opaque `session_token`, then asks ElevenLabs for a signed
        WebSocket URL for the private agent. The ElevenLabs API key stays in server-side
        configuration and is never returned, logged or placed in any response. The agent ID is not
        returned as a field; the provider's signed URL may contain it, which is acceptable because
        the agent requires authentication and the ID alone cannot open a conversation. The browser passes `signed_url` to the ElevenLabs
        client to open the conversation and uses `session_token` as the bearer token for every other
        endpoint. Each call creates a new session; a signed URL is single-conversation and
        short-lived, so request it immediately before connecting.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
      responses:
        "201":
          description: Session created.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [session_id, session_token, signed_url, signed_url_expires_at, session_expires_at]
                properties:
                  session_id: { type: string, format: uuid }
                  session_token:
                    type: string
                    minLength: 32
                    description: Opaque random secret bound to session_id. Keep in memory only.
                  signed_url:
                    type: string
                    format: uri
                    pattern: "^wss://"
                    description: Signed ElevenLabs conversation WebSocket URL for the private agent.
                  signed_url_expires_at:
                    type: string
                    format: date-time
                    description: Connect before this time. After it, request a new session.
                  session_expires_at:
                    type: string
                    format: date-time
                    description: Hard end of the session, 60 minutes after creation.
        "502":
          description: ElevenLabs did not return a signed URL. No session is created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Voice is not configured on the server. No session is created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /transcripts:
    post:
      tags: [transcripts]
      operationId: appendTranscript
      summary: Append timestamped entries to the session transcript.
      description: |
        The browser posts every user and agent turn, and one entry per finished tool call, in the
        order they happened. The stored transcript is the full timestamped record of the session and
        the evidence the capture handlers check for readback and spoken yes.

        Rules:

        - `seq` is assigned by the browser, starts at 1 and increases by exactly 1 per entry.
        - Append only. Re-posting an entry with the same seq and identical content is accepted and
          ignored. The same seq with different content is `409 seq_conflict`. A gap is
          `409 seq_gap` with `expected_seq`.
        - `role: user` entries are final speech-recognition text of what the user said aloud,
          unedited. Phase 1 has no typed input; a user entry is always spoken.
        - `role: agent` entries are the text the agent actually spoke. If the user interrupted the
          agent, post the truncated text that was spoken and set `interrupted: true`.
        - Never fabricate speech. An entry holds only words that were actually spoken or heard.
          When the heard part of an interrupted agent turn is unknown, post `text: ""` with
          `interrupted: true`; do not post the full generated reply as if it had been spoken, and
          do not mark a turn interrupted unless the provider reported an interruption or a
          correction for it. A turn with no recognized user speech produces no user entry.
        - The backend records its own receipt time for every entry, next to the entry. It is not
          part of the entry and is used only for the 120-second confirmation window.
        - Stored entries are raw. The backend stores `text` exactly as posted, never trims,
          truncates, normalizes or rewrites it, and returns it unchanged. Normalization happens
          only in memory, when comparing.
        - `role: tool` entries are posted after the tool returns, with `tool_name` and the result
          body serialized in `text`.
        - `final: true` ends the session (End Session button, or the conversation closed).
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [session_id, entries]
              properties:
                session_id: { type: string, format: uuid }
                conversation_id:
                  type: string
                  maxLength: 128
                  description: ElevenLabs conversation ID, when the client knows it. Stored for audit.
                entries:
                  type: array
                  minItems: 0
                  maxItems: 50
                  items: { $ref: "#/components/schemas/TranscriptEntry" }
                final:
                  type: boolean
                  default: false
                  description: True on the last batch. An empty `entries` array is allowed with final true.
      responses:
        "200":
          description: Entries stored (or already stored).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [session_id, accepted, last_seq, session_state]
                properties:
                  session_id: { type: string, format: uuid }
                  accepted: { type: integer, minimum: 0, description: Newly stored entries. }
                  last_seq: { type: integer, minimum: 0, description: Highest stored seq. }
                  session_state: { enum: [active, ended] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/SessionNotFound" }
        "409":
          description: seq_conflict, seq_gap or session_ended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /intents:
    get:
      tags: [intents]
      operationId: listIntents
      summary: List the captured intents of a session, newest first.
      description: Used by the dashboard to show what has been prepared for approval. Read only.
      security:
        - sessionToken: []
      parameters:
        - name: session_id
          in: query
          required: true
          schema: { type: string, format: uuid }
          description: Must be the session the bearer token belongs to.
        - name: intent
          in: query
          required: false
          schema: { enum: [place_order, cancel_order, order_status, market_query] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: before
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Return intents created strictly before this time (pagination).
      responses:
        "200":
          description: Intents of the session.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [session_id, simulated, count, intents]
                properties:
                  session_id: { type: string, format: uuid }
                  simulated: { const: true }
                  count: { type: integer, minimum: 0 }
                  intents:
                    type: array
                    items: { $ref: "#/components/schemas/Intent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/SessionNotFound" }
    post:
      tags: [intents]
      operationId: createIntent
      summary: Capture a place_order or cancel_order intent.
      description: |
        The canonical capture operation. The two capture tool handlers are thin aliases of it:
        `POST /tools/capture_order_intent` equals this operation with `intent: place_order`, and
        `POST /tools/capture_cancel_intent` equals it with `intent: cancel_order`. All three run the
        same validation, the same transcript confirmation enforcement and the same idempotency
        rules. order_status and market_query intents cannot be created here; the query handlers
        write them.
      security:
        - sessionToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/CreatePlaceOrderIntent"
                - $ref: "#/components/schemas/CreateCancelOrderIntent"
              discriminator:
                propertyName: intent
                mapping:
                  place_order: "#/components/schemas/CreatePlaceOrderIntent"
                  cancel_order: "#/components/schemas/CreateCancelOrderIntent"
      responses:
        "201": { $ref: "#/components/responses/Captured" }
        "200": { $ref: "#/components/responses/CapturedDuplicate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/SessionNotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /tools/capture_order_intent:
    post:
      tags: [tools]
      operationId: toolCaptureOrderIntent
      summary: Handler for client tool capture_order_intent. Captures a place_order intent.
      security:
        - sessionToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ToolEnvelope"
                - type: object
                  required: [parameters]
                  properties:
                    parameters: { $ref: "#/components/schemas/CaptureOrderParameters" }
      responses:
        "201": { $ref: "#/components/responses/Captured" }
        "200": { $ref: "#/components/responses/CapturedDuplicate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/SessionNotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /tools/capture_cancel_intent:
    post:
      tags: [tools]
      operationId: toolCaptureCancelIntent
      summary: Handler for client tool capture_cancel_intent. Captures a cancel_order intent.
      security:
        - sessionToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ToolEnvelope"
                - type: object
                  required: [parameters]
                  properties:
                    parameters: { $ref: "#/components/schemas/CaptureCancelParameters" }
      responses:
        "201": { $ref: "#/components/responses/Captured" }
        "200": { $ref: "#/components/responses/CapturedDuplicate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/SessionNotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /tools/get_order_status:
    post:
      tags: [tools]
      operationId: toolGetOrderStatus
      summary: SIMULATED. Handler for client tool get_order_status. Reports capture status only.
      description: |
        Searches the place_order intents captured in the calling session for the given venue and
        returns them with `capture_status: captured` and whether a cancel has also been captured.
        It never reports exchange status: `execution` is always `none`. A reference the user
        supplied that is not the id of a captured intent returns `count: 0`. An `order_id` that is
        not the id of a captured intent and normalizes to the empty string (for example "--") is
        `400 invalid_parameters`. Writes one order_status intent as an audit record
        (`confirmed_by_user: false`), see `x-audit-records`.
      security:
        - sessionToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ToolEnvelope"
                - type: object
                  required: [parameters]
                  properties:
                    parameters: { $ref: "#/components/schemas/GetOrderStatusParameters" }
      responses:
        "200":
          description: Simulated capture-status answer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderStatusResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/SessionNotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /tools/search_markets:
    post:
      tags: [tools]
      operationId: toolSearchMarkets
      summary: SIMULATED. Handler for client tool search_markets.
      description: |
        Case-insensitive search of `x-simulated-catalog` for the given venue over instrument, title
        and aliases, by the rules in `x-query-matching`. Results keep catalog order. Writes one
        market_query intent whose `instrument` is the bounded form of `query` defined in
        `x-audit-records`.
      security:
        - sessionToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ToolEnvelope"
                - type: object
                  required: [parameters]
                  properties:
                    parameters: { $ref: "#/components/schemas/SearchMarketsParameters" }
      responses:
        "200":
          description: Simulated search results (possibly empty).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchMarketsResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/SessionNotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /tools/get_orderbook:
    post:
      tags: [tools]
      operationId: toolGetOrderbook
      summary: SIMULATED. Handler for client tool get_orderbook.
      description: |
        Returns the catalog book of one exact instrument, cut to `depth` levels per side. For
        gemini_prediction the book is the YES contract in dollars per contract. `spread` is
        best_ask minus best_bid and is null unless both sides have a quote. Writes one market_query
        intent whose `instrument` is the resolved instrument.
      security:
        - sessionToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ToolEnvelope"
                - type: object
                  required: [parameters]
                  properties:
                    parameters: { $ref: "#/components/schemas/GetOrderbookParameters" }
      responses:
        "200":
          description: Simulated order book.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderbookResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/SessionNotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

components:
  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <session_token>` from POST /voice/signed-url. The token authorizes
        exactly one session. A request whose body or query names a different session_id is 401.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: |
        UUID v4 generated by the caller once per logical request and reused on every retry of that
        request. See x-idempotency.

  responses:
    Captured:
      description: Intent captured. Nothing was sent to Gemini.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CaptureResult" }
    CapturedDuplicate:
      description: This confirmation or Idempotency-Key was already captured; the original intent is returned with duplicate true.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CaptureResult" }
    BadRequest:
      description: invalid_parameters. The body, query or header failed schema validation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: unauthorized. Missing or wrong session token, or token and session_id do not match.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    SessionNotFound:
      description: session_not_found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: |
        One of transcript_not_synced, session_ended, confirmation_already_used,
        cancel_already_captured, idempotency_key_reused.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: |
        Well-formed request that fails a domain or confirmation rule. One of unknown_instrument,
        invalid_side_for_venue, invalid_quantity, invalid_price, venue_mismatch,
        instrument_mismatch, order_not_cancellable, order_id_not_user_supplied,
        confirmation_required, confirmation_missing, readback_missing, readback_interrupted,
        readback_mismatch, utterance_mismatch.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Intent:
      $ref: "./intent.schema.json"

    Venue:
      type: string
      enum: [gemini_prediction, gemini_spot]

    TranscriptEntry:
      type: object
      additionalProperties: false
      required: [seq, role, text, timestamp]
      properties:
        seq:
          type: integer
          minimum: 1
          description: Position in the session, contiguous from 1.
        role:
          type: string
          enum: [user, agent, tool]
        text:
          type: string
          maxLength: 8000
          description: |
            user: final speech-recognition text, unedited. agent: text actually spoken.
            tool: the tool result body serialized as JSON.
        timestamp:
          type: string
          format: date-time
          description: Browser clock when the turn finished, ISO 8601 UTC.
        interrupted:
          type: boolean
          default: false
          description: Agent entries only. True when the user cut the agent off before it finished.
        tool_name:
          type: string
          enum: [capture_order_intent, capture_cancel_intent, get_order_status, search_markets, get_orderbook]
          description: Required when role is tool, absent otherwise.

    ToolEnvelope:
      type: object
      description: |
        What the browser wrapper adds around the model-supplied tool parameters. The model never
        sees or sets these fields.
      required: [session_id, last_transcript_seq]
      properties:
        session_id: { type: string, format: uuid }
        last_transcript_seq:
          type: integer
          minimum: 0
          description: |
            Highest transcript seq the browser has produced and flushed before this call. If the
            backend has stored less, it answers 409 transcript_not_synced and the wrapper flushes
            and retries with the same Idempotency-Key.

    CaptureOrderParameters:
      type: object
      additionalProperties: false
      required: [venue, instrument, side, quantity, limit_price, confirmed_by_user, utterance]
      properties:
        venue: { $ref: "#/components/schemas/Venue" }
        instrument: { type: string, pattern: "^[A-Z0-9][A-Z0-9-]{0,63}$" }
        side: { type: string, enum: [buy, sell, "yes", "no"] }
        quantity: { type: number, exclusiveMinimum: 0 }
        limit_price: { type: number, exclusiveMinimum: 0 }
        confirmed_by_user: { type: boolean }
        utterance: { type: string, minLength: 1, maxLength: 2000 }

    CaptureCancelParameters:
      type: object
      additionalProperties: false
      required: [venue, order_id, confirmed_by_user, utterance]
      properties:
        venue: { $ref: "#/components/schemas/Venue" }
        order_id: { type: string, minLength: 1, maxLength: 64 }
        instrument:
          type: [string, "null"]
          maxLength: 64
        confirmed_by_user: { type: boolean }
        utterance: { type: string, minLength: 1, maxLength: 2000 }

    GetOrderStatusParameters:
      type: object
      additionalProperties: false
      required: [venue, utterance]
      properties:
        venue: { $ref: "#/components/schemas/Venue" }
        order_id: { type: [string, "null"], minLength: 1, maxLength: 64 }
        instrument: { type: [string, "null"], maxLength: 64 }
        side: { type: [string, "null"], enum: [buy, sell, "yes", "no", null] }
        utterance: { type: string, minLength: 1, maxLength: 2000 }

    SearchMarketsParameters:
      type: object
      additionalProperties: false
      required: [venue, query, utterance]
      properties:
        venue: { $ref: "#/components/schemas/Venue" }
        query: { type: string, minLength: 1, maxLength: 120 }
        limit: { type: [integer, "null"], minimum: 1, maximum: 5, default: 3 }
        utterance: { type: string, minLength: 1, maxLength: 2000 }

    GetOrderbookParameters:
      type: object
      additionalProperties: false
      required: [venue, instrument, utterance]
      properties:
        venue: { $ref: "#/components/schemas/Venue" }
        instrument: { type: string, pattern: "^[A-Z0-9][A-Z0-9-]{0,63}$" }
        depth: { type: [integer, "null"], minimum: 1, maximum: 5, default: 3 }
        utterance: { type: string, minLength: 1, maxLength: 2000 }

    CreatePlaceOrderIntent:
      description: Body of POST /intents for a place_order. Same fields as the capture_order_intent tool plus the envelope.
      type: object
      additionalProperties: false
      required: [session_id, last_transcript_seq, intent, venue, instrument, side, quantity, limit_price, confirmed_by_user, utterance]
      properties:
        session_id: { type: string, format: uuid }
        last_transcript_seq: { type: integer, minimum: 0 }
        intent: { const: place_order }
        venue: { $ref: "#/components/schemas/Venue" }
        instrument: { type: string, pattern: "^[A-Z0-9][A-Z0-9-]{0,63}$" }
        side: { type: string, enum: [buy, sell, "yes", "no"] }
        quantity: { type: number, exclusiveMinimum: 0 }
        limit_price: { type: number, exclusiveMinimum: 0 }
        confirmed_by_user: { type: boolean }
        utterance: { type: string, minLength: 1, maxLength: 2000 }

    CreateCancelOrderIntent:
      description: Body of POST /intents for a cancel_order. Same fields as the capture_cancel_intent tool plus the envelope.
      type: object
      additionalProperties: false
      required: [session_id, last_transcript_seq, intent, venue, order_id, confirmed_by_user, utterance]
      properties:
        session_id: { type: string, format: uuid }
        last_transcript_seq: { type: integer, minimum: 0 }
        intent: { const: cancel_order }
        venue: { $ref: "#/components/schemas/Venue" }
        order_id: { type: string, minLength: 1, maxLength: 64 }
        instrument: { type: [string, "null"], maxLength: 64 }
        confirmed_by_user: { type: boolean }
        utterance: { type: string, minLength: 1, maxLength: 2000 }

    CaptureResult:
      type: object
      additionalProperties: false
      required: [ok, simulated, duplicate, intent, say]
      properties:
        ok: { const: true }
        simulated: { const: true }
        duplicate:
          type: boolean
          description: False with 201. True with 200, when the original intent is returned unchanged.
        intent: { $ref: "#/components/schemas/Intent" }
        say:
          const: "I've prepared that for approval."
          description: The exact sentence the agent speaks after a capture.

    OrderStatusMatch:
      type: object
      additionalProperties: false
      required: [intent_id, venue, instrument, side, quantity, limit_price, capture_status, cancel_captured, created_at]
      properties:
        intent_id: { type: string, format: uuid }
        venue: { $ref: "#/components/schemas/Venue" }
        instrument: { type: string }
        side: { type: string, enum: [buy, sell, "yes", "no"] }
        quantity: { type: number }
        limit_price: { type: number }
        capture_status: { const: captured }
        cancel_captured: { type: boolean }
        created_at: { type: string, format: date-time }

    OrderStatusResult:
      type: object
      additionalProperties: false
      required: [ok, simulated, execution, count, matches, query_intent_id]
      properties:
        ok: { const: true }
        simulated: { const: true }
        execution: { const: none }
        count: { type: integer, minimum: 0 }
        matches:
          type: array
          maxItems: 5
          description: Newest first.
          items: { $ref: "#/components/schemas/OrderStatusMatch" }
        query_intent_id: { type: string, format: uuid }

    SpotResult:
      type: object
      additionalProperties: false
      required: [venue, instrument, title, market_status, best_bid, best_ask, last_price]
      properties:
        venue: { const: gemini_spot }
        instrument: { type: string }
        title: { type: string }
        market_status: { enum: [open, closed] }
        best_bid: { type: number }
        best_ask: { type: number }
        last_price: { type: number }

    PredictionResult:
      type: object
      additionalProperties: false
      required: [venue, instrument, title, market_status, closes_at, yes_bid, yes_ask, no_bid, no_ask]
      properties:
        venue: { const: gemini_prediction }
        instrument: { type: string }
        title: { type: string }
        market_status: { enum: [open, closed] }
        closes_at: { type: string, format: date-time }
        yes_bid: { type: number }
        yes_ask: { type: number }
        no_bid: { type: number }
        no_ask: { type: number }

    SearchMarketsResult:
      type: object
      additionalProperties: false
      required: [ok, simulated, venue, as_of, count, results, query_intent_id]
      properties:
        ok: { const: true }
        simulated: { const: true }
        venue: { $ref: "#/components/schemas/Venue" }
        as_of: { type: string, format: date-time, description: Backend clock at response time. }
        count: { type: integer, minimum: 0 }
        results:
          type: array
          maxItems: 5
          items:
            oneOf:
              - $ref: "#/components/schemas/SpotResult"
              - $ref: "#/components/schemas/PredictionResult"
        query_intent_id: { type: string, format: uuid }

    BookLevel:
      type: object
      additionalProperties: false
      required: [price, size]
      properties:
        price: { type: number }
        size: { type: number }

    OrderbookResult:
      type: object
      additionalProperties: false
      required: [ok, simulated, venue, instrument, as_of, bids, asks, best_bid, best_ask, spread, query_intent_id]
      properties:
        ok: { const: true }
        simulated: { const: true }
        venue: { $ref: "#/components/schemas/Venue" }
        instrument: { type: string }
        as_of: { type: string, format: date-time }
        bids:
          type: array
          description: Highest price first.
          items: { $ref: "#/components/schemas/BookLevel" }
        asks:
          type: array
          description: Lowest price first.
          items: { $ref: "#/components/schemas/BookLevel" }
        best_bid: { type: [number, "null"] }
        best_ask: { type: [number, "null"] }
        spread: { type: [number, "null"] }
        query_intent_id: { type: string, format: uuid }

    Error:
      type: object
      additionalProperties: false
      required: [ok, simulated, error]
      properties:
        ok: { const: false }
        simulated: { const: true }
        error:
          type: object
          additionalProperties: false
          required: [code, message, agent_hint]
          properties:
            code:
              type: string
              description: One of x-error-codes.
            message: { type: string }
            agent_hint:
              type: string
              description: The fixed hint for this code from x-error-codes. Tells the agent what to do next.
            expected_seq:
              type: integer
              description: Only with seq_gap and transcript_not_synced. The next seq the backend expects.
            existing_intent_id:
              type: string
              format: uuid
              description: Only with confirmation_already_used and cancel_already_captured.

# ---------------------------------------------------------------------------------------------
# Cross-cutting behavior. Normative.
# ---------------------------------------------------------------------------------------------

x-session-lifecycle:
  summary: One session is one ElevenLabs conversation. session_id ties intents and transcript together.
  states: [created, active, ended]
  steps:
    - "Start Voice: the browser calls POST /voice/signed-url. The backend mints session_id (UUID v4) and session_token, stores the session in state created, and returns the signed URL."
    - "The browser opens the ElevenLabs conversation with signed_url and keeps session_id and session_token in memory only (not localStorage, not the URL). session_token is the only credential and is never given to the model: it appears in no tool parameter, tool result or transcript entry. session_id is an identifier, not a credential; the model never supplies it, but it does appear inside the intent returned by a capture tool, and the agent must not speak it."
    - "The first accepted POST /transcripts moves the session to active."
    - "During the session the browser posts transcript entries as turns finish, and each client tool wrapper flushes pending entries before it calls its handler."
    - "End Session, or the conversation closing for any reason, makes the browser post its remaining entries with final true. The session moves to ended."
    - "The backend also ends a session 10 minutes after its last accepted request and at session_expires_at (60 minutes after creation), whichever comes first."
    - "An ended session accepts no transcript entries and no tool or intent writes (409 session_ended). GET /intents keeps working until session_expires_at so the dashboard can still show what was prepared."
    - "A dropped connection is not resumed. The browser starts over with POST /voice/signed-url and gets a new session_id. Confirmations never carry across sessions; get_order_status sees only the calling session."
  rules:
    - "session_id is always minted by the backend. A client-chosen session_id is never accepted."
    - "Every intent and every transcript entry belongs to exactly one session_id."
    - "A session that was created but never connected ends at signed_url_expires_at."

x-confirmation-enforcement:
  summary: >
    A place_order or cancel_order intent is stored only when the stored transcript shows the agent
    reading back these exact terms, uninterrupted, and the user answering with an unambiguous
    spoken yes and nothing else, directly before the capture call. confirmed_by_user true in the
    request is necessary and never sufficient. When in doubt the answer is no: the agent reads the
    terms back again.
  definitions:
    C: >
      The confirmation: the trailing run of consecutive role user entries of the session at the
      time of the call, ignoring tool entries. Speech recognition may deliver one spoken answer as
      several entries, so the whole run is judged together. Its text is the entries' texts in seq
      order joined by single spaces. Its seq is the seq of its last entry. Its time is the
      moment the backend received its last entry, by the backend clock. The entry's own
      `timestamp` is the browser clock; it is stored and shown but never used for this window,
      so a browser clock that runs ahead or behind cannot reject or extend a confirmation.
    R: >
      The entry directly before the first entry of C when tool entries are ignored. It must be a
      role agent entry.
  checks_in_order:
    - code: confirmation_required
      rule: "confirmed_by_user in the request is true."
    - code: confirmation_missing
      rule: "C exists, the backend received its last entry at most 120 seconds before it receives the call, and C as a whole is an explicit yes (see explicit_yes). Every entry of the run counts: a yes in one entry does not confirm when another entry of the run carries a question, a correction, a negation or any other content."
    - code: readback_missing
      rule: "R exists, is a role agent entry, and its normalized text contains 'say yes to confirm'. Because C is the whole trailing run of user entries, any user speech after the readback is part of C; it cannot be skipped to reach an earlier readback."
    - code: readback_interrupted
      rule: "R.interrupted is not true. A readback the user cut off was not heard in full and confirms nothing."
    - code: readback_mismatch
      rule: "R states exactly the terms in the request (see readback_match). Any change after the readback, to instrument, side, quantity, price, venue or order reference, therefore needs a new readback and a new yes."
    - code: confirmation_already_used
      rule: "C has not already confirmed a different intent (see x-idempotency)."
  explicit_yes:
    normalization: "Quote folding (x-normalization quote_characters), lower case, strip punctuation, collapse whitespace. The question check below runs before punctuation is stripped."
    rule: >
      All three must hold for the text of C. (1) No entry of C contains a question mark (U+003F
      or U+FF1F): a question is not a confirmation, even 'yes?'. (2) At least one word is a yes
      word. (3) Every other word is an allowed filler. Anything else is not a confirmation,
      including a yes combined with a change ('yes but make it ten'), a negation in any position
      ('no yes', 'yes no wait'), a number, or a vague assent on its own ('okay', 'sure',
      'sounds good'). The lists are closed: a word that is on neither list fails the check.
    yes_words: ["yes", "yeah", "yep", "yup"]
    allowed_fillers: ["please", "confirm", "confirmed", "i", "correct", "thats", "that", "is", "right", "go", "ahead", "and", "do", "it", "thanks", "thank", "you", "sure", "absolutely", "definitely", "ok", "okay", "uh", "um", "er", "ah"]
    examples_accept: ["Yes.", "yes please", "Yeah, that's right.", "Yes, confirm.", "yep go ahead", "um, yes", "Yes, go ahead and do it.", "entries ['um', 'yes']", "entries ['yes', 'yes please']"]
    examples_reject: ["okay", "sure", "sounds good", "yes but make it ten", "yes, no wait", "I guess", "do it", "confirm", "Yes?", "yes, right?", "no yes", "entries ['yes', 'but make it two']", "entries ['no', 'yes']", "entries ['yes', 'actually no']", "entries ['yes', 'wait what was the price?']"]
  readback_templates:
    note: "The agent must speak these sentences. Numbers are written as digits. The backend matches terms, not the whole sentence."
    spot_order: "Confirming: {side} {quantity} {instrument} on Gemini spot at a limit of {limit_price} dollars. Say yes to confirm."
    prediction_order: "Confirming: buy {quantity} {side} contracts of {instrument} on Gemini prediction at a limit of {limit_price_in_cents} cents each. Say yes to confirm."
    cancel_by_user_reference: "Confirming: cancel order {order_id} on Gemini {spot|prediction}. Say yes to confirm."
    cancel_of_prepared_spot_order: "Confirming: cancel your prepared order to {side} {quantity} {instrument} on Gemini spot at a limit of {limit_price} dollars. Say yes to confirm."
    cancel_of_prepared_prediction_order: "Confirming: cancel your prepared order to buy {quantity} {side} contracts of {instrument} on Gemini prediction at a limit of {limit_price_in_cents} cents each. Say yes to confirm."
  readback_match:
    normalization: "Lower case; remove thousands separators inside numbers and currency symbols; keep decimal points and hyphens inside words; strip other punctuation; collapse whitespace. Numbers are compared by numeric value, so 0.5 equals 0.50 and 97,000 equals 97000."
    place_order_spot:
      - "contains the phrase 'gemini spot'"
      - "contains the instrument as a whole word, case-insensitive"
      - "contains the side word (buy or sell) as a whole word"
      - "contains a number equal to quantity"
      - "contains a number equal to limit_price directly followed by 'dollars'"
      - "does not contain the word 'cancel'"
    place_order_prediction:
      - "contains the phrase 'gemini prediction'"
      - "contains the instrument as a whole word, case-insensitive"
      - "contains the phrase '{side} contracts' (yes contracts or no contracts)"
      - "contains a number equal to quantity"
      - "contains a number equal to limit_price times 100 directly followed by 'cents', or a number equal to limit_price directly followed by 'dollars'"
      - "does not contain the word 'cancel'"
    cancel_order_by_user_reference:
      - "contains the word 'cancel'"
      - "contains the phrase 'gemini spot' or 'gemini prediction' matching venue"
      - "after removing every non-alphanumeric character from the readback, contains the normalized order_id"
    cancel_order_of_prepared_order:
      - "contains the word 'cancel'"
      - "passes every place_order check for the target intent's venue, instrument, side, quantity and limit_price, except the 'does not contain cancel' check"

x-idempotency:
  summary: A retry never creates a second intent, and one spoken yes never confirms two different things.
  rules:
    - "Idempotency-Key: the first completed response for a (session_id, Idempotency-Key) pair is stored for the life of the session and replayed byte for byte on any later request with the same key and the same body. The same key with a different body is 409 idempotency_key_reused. Errors with code transcript_not_synced are not stored, so the wrapper can flush and retry with the same key."
    - "Confirmation binding: each capture consumes its confirmation C, identified by (session_id, seq of the last entry of C). A later capture call that resolves to the same C with identical normalized terms (intent, venue, instrument, side, quantity, limit_price, order_id) returns 200 with duplicate true and the original intent, whatever its Idempotency-Key. This covers the model calling the tool twice for one yes."
    - "The same C with different terms is 409 confirmation_already_used with existing_intent_id. A second, identical order needs its own readback and its own yes."
    - "cancel_order: at most one cancel intent per prepared order per session. A further cancel for the same target with a new confirmation is 409 cancel_already_captured with existing_intent_id."
    - "Query handlers honor Idempotency-Key replay as well, so a retried query writes one audit intent, not two."
    - "POST /transcripts is idempotent on (session_id, seq) as described on the endpoint."

x-normalization:
  summary: How spoken values become stored values. The agent normalizes before the readback; the backend validates the result and normalizes again when comparing with the transcript.
  limit_price:
    - "Always stored as a decimal number of US dollars. Never a string, never cents."
    - "gemini_spot: dollars per base unit, at most 2 decimals. 'ninety seven thousand' is 97000; '97k' is 97000; 'thirty four ten fifty' must be clarified; 'three thousand four hundred ten dollars and fifty cents' is 3410.5."
    - "gemini_prediction: dollars per contract, 0.01 to 0.99, 0.01 steps. '62 cents' is 0.62; 'point six two' and '0.62 dollars' are 0.62; a bare '62' or '62 percent' said about a prediction contract is read as 62 cents and stored as 0.62, and the readback says '62 cents' so the user confirms the unit."
    - "A prediction price outside 1 to 99 cents, or with a fraction of a cent, is not normalized. The agent asks again."
    - "Not a limit price, so the agent asks for an exact number: 'market', 'market price', 'at the ask', 'at the bid', 'best price', 'current price', 'whatever it is', 'around', 'about', 'a bit under', ranges, and percentages off a quote. The agent may offer the simulated quote from a tool but the number must come from the user's mouth."
    - "Phase 1 captures limit orders only. There is no market order."
  quantity:
    - "gemini_spot: base-asset units as a decimal, at most 8 decimals. 'half a bitcoin' is 0.5; 'a quarter of an ether' is 0.25; 'two' is 2."
    - "gemini_prediction: whole contracts. 'ten contracts' is 10. A fractional contract count is asked again."
    - "Not a quantity, so the agent asks for one: a dollar amount to spend ('five hundred dollars of bitcoin'), 'some', 'a few', 'a couple', 'all of it', 'max'. The agent does not convert dollars into units."
  side:
    - "gemini_spot: buy or sell. 'pick up' and 'get me' mean buy; 'offload' and 'get rid of' mean sell. Anything less clear, including 'short' and 'long', is asked again with 'Buy or sell?'."
    - "gemini_prediction: yes or no, meaning buy contracts of that outcome. 'I think it happens' is not a side; the agent asks 'Yes or no contracts?'. Selling or closing prediction contracts cannot be captured in Phase 1."
  instrument:
    - "Stored upper case exactly as returned by search_markets or get_orderbook. The agent resolves every instrument through search_markets and never builds a symbol or ticker from a name."
    - "If search_markets returns more than one plausible match the agent asks which one. If it returns none the agent says it found no such Gemini market."
  order_reference:
    - "Reference normalization: upper case, spelled digits to digits ('one two three' to 123, 'oh' and 'zero' to 0), remove every character that is not a letter or digit. 'a b dash one two three four five' is AB12345."
    - "A user-supplied reference is stored in this normalized form and is accepted only if the same normalized string occurs in the normalized concatenation of the session's user entries."
    - "A reference that normalizes to the empty string is not a reference. get_order_status answers 400 invalid_parameters; capture_cancel_intent answers 422 order_id_not_user_supplied. Nothing is stored in either case."
    - "The id of a captured intent is a UUID; it is compared exactly and stored in canonical lower-case hyphenated form."
  text_comparison:
    - "For utterance and yes checks: lower case, strip punctuation, collapse whitespace."
  quote_characters:
    - "Before any text comparison (explicit yes, readback match, utterance check, reference check) the backend applies Unicode NFKC and folds typographic quotes to ASCII: U+2018, U+2019, U+02BC and U+0060 become U+0027; U+201C and U+201D become U+0022. Speech recognition and the model emit either form, so \"that\u2019s right\" and \"that's right\" are the same text."
    - "After folding, apostrophes and quotation marks are punctuation and are stripped, so \"that's\" compares as \"thats\"."
    - "Stored text is never rewritten: transcript entries and intent.utterance keep the characters they arrived with."
    - "The fixed capture sentence in `say` uses the ASCII apostrophe U+0027: I've prepared that for approval."

x-utterance-check:
  summary: utterance must be the user's own recorded words.
  rule: >
    Normalize the utterance and the concatenation, in seq order joined by single spaces, of all role
    user entries of the session up to and including C (for query handlers: all role user entries
    stored at the time of the call). The utterance must be a contiguous substring of that
    concatenation and must not be empty after normalization.
  on_failure:
    capture_handlers: "422 utterance_mismatch. Nothing is stored. The agent calls again with the verbatim words; the same confirmation is still valid within its 120 seconds."
    query_handlers: "If the session has at least one role user entry with non-empty normalized text, no error: the audit intent uses the latest such entry, bounded as in x-audit-records. If the session has none, there is no user speech to record: 422 utterance_mismatch, nothing is stored and no query result is returned. The supplied utterance is never stored as the user's words unless it was found in the transcript."

x-audit-records:
  summary: >
    Every stored intent must validate against contracts/intent.schema.json. Fields of the
    order_status and market_query audit intents are derived from the request and are bounded so
    that a valid query request never fails because of its audit record. They are display copies;
    the transcript is the evidence and is never altered.
  derived_fields:
    - "market_query from search_markets: instrument is the query with leading and trailing whitespace removed, cut to its first 64 characters (Unicode code points). The full query is still used for matching. A query that is empty after trimming is 400 invalid_parameters."
    - "market_query from get_orderbook: instrument is the resolved catalog instrument."
    - "order_status: instrument is the instrument filter or the empty string; side is the side filter or null; order_id is the id of the matching captured intent, or the normalized user reference, or null when no order_id was given."
    - "utterance, when the supplied utterance was found in the transcript: the supplied utterance as given (at most 2000 characters by the request schema)."
    - "utterance, fallback: the text of the latest role user entry with non-empty normalized text, cut to its first 2000 characters. Nothing is added, paraphrased or joined."
  rules:
    - "Bounding applies only to these derived fields of audit intents. Transcript entries keep their full raw text (up to 8000 characters) exactly as posted."
    - "Bounding never applies to place_order or cancel_order intents. Their utterance is verified as a contiguous substring of the user transcript and a failure is utterance_mismatch."
    - "No field is ever filled with invented or model-written speech. When there is no user speech, no audit intent is written and the query is refused (x-utterance-check)."
    - "If a derived audit intent still fails schema validation, that is a server defect: 500, nothing stored. It is not reported as invalid_parameters."

x-query-matching:
  summary: Exact rules for search_markets. Deterministic, no fuzzy matching, no ranking.
  steps:
    - "Fold: Unicode NFKC, quote folding, lower case. Applied to the query and to each catalog instrument, title and alias."
    - "Split the folded query into words: maximal runs of letters and digits. Every other character separates words, so 'BTC/USD' is btc and usd, and '150,000' is 150 and 000."
    - "Drop stop words: market, markets, contract, contracts, price, prices, spot, prediction, predictions, gemini, the, and, for."
    - "Drop words shorter than 3 characters."
    - "If no word remains, nothing matches: count 0 and an empty results array. A query never matches the whole catalog by default."
    - "An item of the given venue matches when every remaining word is a substring of at least one of its folded instrument, title or aliases. Different words may match different fields."
    - "Results keep catalog order and are cut to limit (default 3). count is the number of results returned."
  examples:
    - { venue: gemini_spot, query: "bitcoin", results: [BTCUSD] }
    - { venue: gemini_spot, query: "bitcoin spot price", results: [BTCUSD] }
    - { venue: gemini_spot, query: "BTC/USD", results: [BTCUSD] }
    - { venue: gemini_spot, query: "bt", results: [] }
    - { venue: gemini_spot, query: "the market", results: [] }
    - { venue: gemini_spot, query: "dogecoin", results: [] }
    - { venue: gemini_prediction, query: "recession market", results: [US-RECESSION-2027] }
    - { venue: gemini_prediction, query: "fed cut contract", results: [FED-CUT-DEC26] }
    - { venue: gemini_prediction, query: "bitcoin", results: [BTC-150K-2026, BTC-120K-2026] }
    - { venue: gemini_prediction, query: "bitcoin 150,000", results: [BTC-150K-2026] }
    - { venue: gemini_prediction, query: "bitcoin election", results: [] }

x-validation-order:
  summary: Handlers return the first failing check, in this order, so error behavior is deterministic.
  capture_handlers:
    - "401 unauthorized"
    - "404 session_not_found"
    - "Idempotency-Key replay (return stored response) or 409 idempotency_key_reused"
    - "409 session_ended"
    - "400 invalid_parameters"
    - "409 transcript_not_synced"
    - "422 domain rules: unknown_instrument, invalid_side_for_venue, invalid_quantity, invalid_price (place_order); order_not_cancellable, venue_mismatch, instrument_mismatch, order_id_not_user_supplied (cancel_order)"
    - "422 confirmation_required, confirmation_missing, readback_missing, readback_interrupted, readback_mismatch"
    - "422 utterance_mismatch"
    - "200 duplicate, 409 confirmation_already_used or 409 cancel_already_captured"
    - "201 captured"
  query_handlers:
    - "401 unauthorized"
    - "404 session_not_found"
    - "Idempotency-Key replay or 409 idempotency_key_reused"
    - "409 session_ended"
    - "400 invalid_parameters (includes a get_order_status order_id that normalizes to the empty string and a search_markets query that is empty after trimming)"
    - "409 transcript_not_synced"
    - "422 unknown_instrument (get_orderbook only)"
    - "422 utterance_mismatch (only when the session has no user speech, see x-utterance-check)"
    - "200 result"

x-error-codes:
  unauthorized: { http: 401, agent_hint: "Say the session has a problem and ask the user to restart voice." }
  session_not_found: { http: 404, agent_hint: "Say the session has a problem and ask the user to restart voice." }
  session_ended: { http: 409, agent_hint: "Say the session has ended and ask the user to start a new one. Do not say anything was prepared." }
  invalid_parameters: { http: 400, agent_hint: "A value is missing or malformed. Ask the user for the missing value; do not guess it." }
  transcript_not_synced: { http: 409, agent_hint: "Handled by the wrapper. If it reaches you, say there was a hiccup and ask the user to say yes again after a new readback." }
  idempotency_key_reused: { http: 409, agent_hint: "Handled by the wrapper. If it reaches you, read the terms back again and ask for yes." }
  seq_conflict: { http: 409, agent_hint: "Not returned to the agent." }
  seq_gap: { http: 409, agent_hint: "Not returned to the agent." }
  unknown_instrument: { http: 422, agent_hint: "Use search_markets to find the exact instrument, then continue. Do not invent a symbol." }
  invalid_side_for_venue: { http: 422, agent_hint: "Spot uses buy or sell; prediction uses yes or no. Ask the user which." }
  invalid_quantity: { http: 422, agent_hint: "Ask the user for the quantity again: units for spot, whole contracts for prediction." }
  invalid_price: { http: 422, agent_hint: "Ask the user for the limit price again: dollars for spot, 1 to 99 cents for prediction." }
  venue_mismatch: { http: 422, agent_hint: "The prepared order is on the other venue. Read the cancel back with the correct venue and ask for yes." }
  instrument_mismatch: { http: 422, agent_hint: "The prepared order is for a different instrument. Use get_order_status to find the right order." }
  order_not_cancellable: { http: 422, agent_hint: "That reference is not a prepared order. Use get_order_status or ask the user for the order ID." }
  order_id_not_user_supplied: { http: 422, agent_hint: "The user has not said that order ID. Ask the user for the order ID; never guess it." }
  confirmation_required: { http: 422, agent_hint: "Read the exact terms back and ask the user to say yes before capturing." }
  confirmation_missing: { http: 422, agent_hint: "The user has not said an explicit yes. Read the exact terms back again and ask them to say yes." }
  readback_missing: { http: 422, agent_hint: "Read the exact terms back, ending with 'Say yes to confirm.', and wait for yes." }
  readback_interrupted: { http: 422, agent_hint: "The readback was cut off. Read the exact terms back again in full and wait for yes." }
  readback_mismatch: { http: 422, agent_hint: "The terms changed since the readback. Read the current terms back and wait for a new yes." }
  confirmation_already_used: { http: 409, agent_hint: "That yes already confirmed another capture. Read the new terms back and wait for a new yes." }
  cancel_already_captured: { http: 409, agent_hint: "A cancel for that order is already prepared. Tell the user so." }
  utterance_mismatch: { http: 422, agent_hint: "Call again with the user's exact words in utterance. If the user has not said anything yet, wait for them to speak." }
  backend_unavailable: { http: null, agent_hint: "Produced by the wrapper. Say you could not reach the service and ask the user to try again. Do not say anything was prepared." }
  elevenlabs_unavailable: { http: 502, agent_hint: "Not returned to the agent." }
  voice_not_configured: { http: 503, agent_hint: "Not returned to the agent." }

x-capture-status-queries:
  summary: What a status question can and cannot be answered with in Phase 1.
  rules:
    - "get_order_status is the only source of status. It is SIMULATED in the sense that it never asks Gemini: it reads the capture store of the calling session and reports capture status only."
    - "Every match has capture_status captured and the response has execution none. The agent says the order is prepared for approval and has not been sent to Gemini. It never says open, working, live, filled, partially filled, executed, cancelled or rejected."
    - "cancel_captured true means a cancel for that prepared order has also been prepared for approval. It does not mean the order was cancelled."
    - "A status question about a reference the user supplied (an order ID that is not the id of a captured intent) returns count 0. The agent may repeat the reference and says it has no prepared order with that reference in this session and cannot see exchange status."
    - "Orders prepared in an earlier session are not visible. The answer is count 0."
    - "venue is required. When the user names no venue and no instrument the agent calls the tool once per venue, or asks which venue."
    - "Each call writes one order_status audit intent with confirmed_by_user false, order_id set to the queried reference or null, instrument set to the filter or the empty string, and side set to the filter or null (x-audit-records)."
    - "An order_id that is not the id of a captured intent and normalizes to the empty string is 400 invalid_parameters. The agent asks the user for the order ID instead of sending punctuation or filler."

x-cancel-resolution:
  summary: How a cancel request becomes exactly one order_id. The agent never chooses between candidates and never invents or completes an ID.
  by_user_reference:
    - "The user speaks a complete order ID. The agent normalizes it (x-normalization order_reference), asks for the venue if it was not said, reads the cancel back with the reference, and captures after an explicit yes. The reference is recorded as stated and is not checked against Gemini."
    - "A partial reference ('the one ending in 45') is not a reference. The agent asks for the full order ID."
  by_description:
    - "The user describes the order in words ('my bitcoin order', 'the fed one', 'the last one'). The agent calls get_order_status with the venue and every filter the user gave (instrument, side)."
    - "count 0: the agent says it has no matching prepared order in this session and asks for the order ID. Nothing is captured."
    - "count 1: the agent reads the cancel back with the full terms of that prepared order (cancel_of_prepared_* template) and captures with order_id set to its intent_id after an explicit yes."
    - "count 2 or more: the description is ambiguous. The agent names the candidates by their distinguishing terms and asks which one. It does not pick the newest, the largest or the first. 'The last one' or 'the most recent one' is a description that selects matches[0] (newest first); the readback still states its full terms."
    - "A match with cancel_captured true already has a prepared cancel. The agent says so and does not capture again (the backend would answer cancel_already_captured)."
  bulk:
    - "There is no bulk cancel. 'Cancel everything' is handled one order at a time, each with its own readback and its own yes."
  backend_guarantees:
    - "order_id must be the id of a place_order intent of this session, or occur in the user's own transcript entries after reference normalization (order_id_not_user_supplied otherwise)."
    - "The readback must state the target's terms or the spoken reference (readback_mismatch otherwise), so a yes to one candidate can never cancel another."

x-execution-boundary:
  summary: >
    Nothing in this system can execute, route, amend or cancel an order on Gemini. Reading
    simulated data and opening a preview are display actions with no effect outside the browser
    tab. The only durable effects are a captured intent and the session transcript, both stored
    locally by this backend.
  what_each_action_can_do:
    - action: "search_markets, get_orderbook, get_order_status"
      effect: "Reads the simulated catalog or the session's own captured intents. Writes one audit intent (order_status or market_query, confirmed_by_user false). Sends nothing to Gemini. Cannot create, change or remove a place_order or cancel_order intent."
    - action: "explore_demo_chart with action explore"
      effect: "Redraws a fabricated five-minute chart in the browser and returns its figures. No request leaves the browser. Nothing is stored."
    - action: "explore_demo_chart with action buy or sell"
      effect: "Shows a preview panel in the browser with execution none. It is a picture of what a trade would look like. No request leaves the browser, no intent is captured, nothing is stored, and no confirmation is asked for because there is nothing to confirm. A preview is not an order, not a prepared order and not a step toward one."
    - action: "capture_order_intent, capture_cancel_intent"
      effect: "Stores one intent with status captured after the transcript shows the exact uninterrupted readback and an unambiguous spoken yes (x-confirmation-enforcement). The intent is a record for later human approval. It is not sent to Gemini and nothing in this phase acts on it."
  rules:
    - "No operation, tool, tool result, preview, button or spoken phrase leads to execution. There is no code path from any of them to Gemini."
    - "A preview never becomes a captured intent on its own. Preparing an order after a preview starts the capture flow from the beginning: every value from the user or a tool, the full readback, then an explicit yes."
    - "A preview shown between a readback and the user's yes breaks that confirmation, because the agent's words about the preview become the latest agent entry. The readback must be given again."
    - "The agent says preview for a preview and prepared for approval for a captured intent. It never says placed, submitted, sent, executed, filled, live, open or cancelled about either."
    - "Every figure shown or spoken is labeled simulated. Chart and catalog data are fabricated fixtures and are never presented as Gemini data."
  future_gemini_access:
    summary: "Not part of this contract. These constraints bind any later revision that adds it."
    constraints:
      - "Gemini credentials live only in server-side configuration. They are never sent to the browser, never placed in a signed URL, tool parameter, tool result, transcript entry, intent or log, and never given to the model or the voice provider."
      - "Every Gemini request is made by the backend. The browser never calls Gemini, and no client tool, including explore_demo_chart, may be given a Gemini call."
      - "The model never triggers execution. A tool call may at most capture an intent. Sending an order to Gemini requires a separate server-side approval step by an authenticated person, acting on a stored intent, outside the voice conversation."
      - "Live Gemini market data, if added, is fetched by the backend and labeled live; simulated data stays labeled simulated, and the two are never mixed in one answer without saying which is which."
      - "Any such change is a new contract revision with its own operations, error codes and evals. Until then status is always captured and execution is always none."

x-browser-tools:
  summary: >
    Agent tools implemented entirely in the browser. They are registered on the voice agent as
    client tools like the other five, but they have no handler in this API, are not forwarded to
    the backend, carry no session_id, Idempotency-Key or utterance, write no intent and add no
    transcript entry. They are listed in contracts/tools.json under browser_tools, separate from
    the five backend tools.
  explore_demo_chart:
    purpose: "Drive the dashboard's simulated five-minute BTC chart, its statistics and its sidebar preview by voice. The same actions are available as buttons; voice and buttons share one chart state."
    parameters:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum: [explore, buy, sell]
          description: "explore redraws the chart and moves the highlighted point to the next minute mark. buy or sell shows a preview of that side at the last simulated price."
    behavior:
      - "Runs synchronously in the browser against a fixed fabricated series. No network request of any kind."
      - "explore: update increases by 1, selected moves to the next point (wrapping), an existing preview is kept."
      - "buy or sell: update increases by 1, selected is the last point, preview becomes that side at last_usd with execution none. A later buy or sell replaces the preview."
      - "The dashboard also has a control that clears the preview. The agent has no action for that."
      - "No confirmation precedes any action. Nothing is captured, so there is nothing to confirm."
      - "The chart symbol BTC/USD is a display label, not an instrument. An order for bitcoin still resolves its instrument through search_markets (BTCUSD)."
    result:
      type: object
      required: [simulated, symbol, window_minutes, points, open_usd, last_usd, high_usd, low_usd, change_usd, change_percent, trend, update, action, selected, preview]
      properties:
        simulated: { const: true }
        symbol: { const: "BTC/USD" }
        window_minutes: { const: 5 }
        points:
          type: array
          description: "Six minute marks spanning five minutes, oldest first."
          items:
            type: object
            required: [time_utc, price_usd]
            properties:
              time_utc: { type: string, description: "HH:MM label of the fabricated series." }
              price_usd: { type: number }
        open_usd: { type: number }
        last_usd: { type: number }
        high_usd: { type: number }
        low_usd: { type: number }
        change_usd: { type: number, description: "last_usd minus open_usd." }
        change_percent: { type: number, description: "Two decimals." }
        trend: { enum: [up, down, flat] }
        update: { type: integer, minimum: 1, description: "Count of chart actions in this page load." }
        action: { enum: [explore, buy, sell] }
        selected:
          type: object
          required: [time_utc, price_usd]
          properties:
            time_utc: { type: string }
            price_usd: { type: number }
        preview:
          description: "Null until a buy or sell preview is shown."
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [side, price_usd, execution]
              properties:
                side: { enum: [buy, sell] }
                price_usd: { type: number }
                execution: { const: none, description: "Always none. A preview executes nothing and captures nothing." }
    error_result:
      description: "Returned when the action is not one of the three values or the voice session is no longer current. It is not the backend error shape."
      example: { simulated: true, ok: false, error: "Chart action unavailable" }
    fixture:
      note: "SIMULATED. Fabricated series, not Gemini data. Values do not move."
      symbol: "BTC/USD"
      points:
        - { time_utc: "14:00", price_usd: 97320 }
        - { time_utc: "14:01", price_usd: 97382 }
        - { time_utc: "14:02", price_usd: 97356 }
        - { time_utc: "14:03", price_usd: 97424 }
        - { time_utc: "14:04", price_usd: 97402 }
        - { time_utc: "14:05", price_usd: 97455 }
      open_usd: 97320
      last_usd: 97455
      high_usd: 97455
      low_usd: 97320
      change_usd: 135
      change_percent: 0.14
      trend: up

