x-revision:
  version: 3.0.0
  supersedes: "2.0.0 (commit 8071df5), which superseded 1.2.0 (commit 05cdad5), 1.1.0 (commit 6582824) and 1.0.0 (commit 856a0e4)"
  history: "Changes A to D were made in 1.1.0, E to G in 1.2.0, H to J in 2.0.0, K to N in 3.0.0. Later entries replace earlier ones: E, I and J (chart tool, spot as context) are fully superseded by K to M."
  compatibility: "3.0.0 is breaking for the two market tools (new parameters, new result shape, new route, old handlers 410) and removes the chart tool; the three capture tools, GET and POST /intents, POST /transcripts, the signed-URL endpoint, confirmation enforcement and the intent field list are unchanged apart from a wider instrument pattern. Earlier note: 2.0.0 is breaking. The nine operations, the five backend tool names and the intent field list are unchanged, but the three order tools and POST /intents no longer accept venue gemini_spot or side buy and sell, and the chart tool's actions and preview fields changed. Earlier revisions added no breaking change."
  changes:
    - id: A
      title: "Confirmation is the whole trailing run of user entries"
      detail: "C is now the trailing run of consecutive user entries, judged together, so speech recognition splitting one answer cannot hide a correction, negation or question, and cannot break a plain yes. A question mark anywhere in C rejects. Fillers and, uh, um, er, ah were added. Confirmation binding uses the seq of the last entry of C. The 120-second window is measured from the backend's receipt of the last entry of C, not from the browser timestamp."
      backend_behavior_change: "entries ['um','yes'] and 'Yes, go ahead and do it.' now confirm; 'Yes?' no longer confirms; entries ['yes','but make it two'] and ['no','yes'] are confirmation_missing; a browser timestamp ahead of or behind the backend clock no longer affects the result."
    - id: B
      title: "Audit records are bounded and never fabricated"
      detail: "New x-audit-records. search_markets stores the first 64 characters of the query as the audit instrument; a fallback utterance is cut to 2000 characters. With no user speech in the session a query handler answers 422 utterance_mismatch and stores nothing. Transcript entries are stored raw and are never trimmed or rewritten. An unknown interrupted agent turn is posted with empty text, never with the unspoken draft."
      backend_behavior_change: "A 65 to 120 character query now succeeds. A fallback from a user entry over 2000 characters now succeeds. A query with no user entry is 422 utterance_mismatch instead of 400. A get_order_status order_id that normalizes to empty is specified as 400 invalid_parameters."
    - id: C
      title: "Query matching is specified exactly"
      detail: "New x-query-matching: word splitting, stop words, the three-character minimum, and no match when no word remains."
      backend_behavior_change: "'bt' now returns nothing instead of the whole catalog; 'recession market', 'fed cut market' and 'bitcoin spot' now match."
    - id: D
      title: "Identifier wording"
      detail: "session_token is the only credential and never reaches the model. session_id is an identifier that appears inside returned intents. The signed URL may contain the agent ID. The API key is never returned."
      backend_behavior_change: "None."
    - id: E
      title: "Browser-only chart tool"
      detail: "New x-browser-tools documents explore_demo_chart: parameters, result, fixture and the fact that it has no endpoint, makes no request and stores nothing. contracts/tools.json lists it under browser_tools; the tools array still holds exactly the five backend tools."
      backend_behavior_change: "None. The backend has no handler for it and POST /tools/explore_demo_chart stays 404."
    - id: F
      title: "Execution boundary"
      detail: "New x-execution-boundary states what each action can and cannot do, that reading simulated data or opening a buy or sell preview can never execute an order, and the constraints any future Gemini access must meet: credentials and every Gemini request stay on the server, and the model never triggers execution."
      backend_behavior_change: "None."
    - id: G
      title: "Conversational scope"
      detail: "The agent is a friendly conversational market demo. The fixed off-topic sentence of earlier evals is retired; off-topic and injection turns are declined in natural words. Confirmation enforcement for captured intents, the readback templates and the capture sentence are unchanged. This was never an API rule, so only contracts/tools.json wording, the prompt and the evals change."
      backend_behavior_change: "None."
    - id: H
      title: "Orders are prediction contracts only"
      detail: "New x-order-scope. capture_order_intent, capture_cancel_intent, get_order_status and POST /intents take venue gemini_prediction only (new OrderVenue schema), side yes or no, whole-contract quantity and a 0.01 to 0.99 limit price. Spot readback templates, spot normalization rules and the venue question for cancels are removed. contracts/intent.schema.json requires venue gemini_prediction for place_order, cancel_order and order_status."
      backend_behavior_change: "An order, cancel or status request with venue gemini_spot, or side buy or sell, is 400 invalid_parameters. A cancel by spoken reference with an instrument outside the prediction catalog is 422 unknown_instrument. Legacy spot order intents are hidden from GET /intents and from status and cancel resolution."
    - id: I
      title: "Spot is read-only context"
      detail: "search_markets and get_orderbook keep gemini_spot unchanged. The spot catalog is unchanged. x-order-scope names the two kinds of price, underlying dollars per coin and outcome dollars per contract, and forbids mixing them."
      backend_behavior_change: "None for search_markets and get_orderbook."
    - id: J
      title: "Chart tool previews a prediction contract"
      detail: "explore_demo_chart actions are explore, yes and no. The result keeps the underlying BTC/USD series, adds underlying_unit and a contract object for the catalog contract BTC-150K-2026, and the preview becomes venue, instrument, side yes or no, contract_price, contract_price_cents and execution none. preview.price_usd and the buy and sell actions are removed."
      backend_behavior_change: "None. The tool is browser-only."
    - id: K
      title: "Market data comes from the Gemini Sandbox"
      detail: "New x-market-data. search_markets takes only query (empty lists active events) and get_orderbook takes only event_ticker and contract_symbol; both are browser client tools forwarded to GET /api/public/market-tools/{tool}. Results use events[].ticker and events[].contracts[].symbol, with buy and sell quotes for yes and no in dollars per contract or null. get_orderbook returns one contract quote, not a depth book."
      backend_behavior_change: "POST /tools/search_markets and POST /tools/get_orderbook answer 410 Gone outside the legacy test mode. The live tools write no audit intent and no transcript entry."
    - id: L
      title: "No chart tool, no spot data"
      detail: "explore_demo_chart and x-browser-tools are removed. gemini_spot is no longer a read surface for the agent. The simulated catalog, x-query-matching and the market_query audit rules are legacy test fixtures (x-legacy)."
      backend_behavior_change: "None beyond K."
    - id: M
      title: "Captured, sandbox account status and exchange execution"
      detail: "x-execution-boundary is rewritten around three states with fixed wording. Sandbox data is real upstream test-environment data and is named as sandbox, never as live and never as invented or simulated."
      backend_behavior_change: "None."
    - id: N
      title: "Instrument is the sandbox contract symbol"
      detail: "An order's instrument is events[].contracts[].symbol. The capture request schemas and the intent schema accept letters, digits, underscore, dot and hyphen. The backend validates the symbol against the sandbox instead of the simulated catalog."
      backend_behavior_change: "unknown_instrument now means the sandbox does not know the symbol. The readback matcher must treat the full symbol, including underscores and dots, as one whole word."
